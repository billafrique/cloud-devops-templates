# Bind to all interfaces inside container
# Docker handles external access restriction via port binding
bind 0.0.0.0

# Password is passed via --requirepass flag in docker-compose command
# so it can be injected from .env at runtime

# RDB snapshots — point-in-time persistence
save 900 1
save 300 10
save 60 10000

# AOF — logs every write for durability
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# Memory — matches container limit of 256M
maxmemory 200mb
maxmemory-policy allkeys-lru

# Data directory — maps to bind mount
dir /data
