version: "3.9"

services:
  frontend:
    image: ${DOCR_ENDPOINT}/frontend-app:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - billafrique_network
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 128M
        reservations:
          cpus: "0.05"
          memory: 64M

networks:
  billafrique_network:
    external: true
    name: billafrique_network
