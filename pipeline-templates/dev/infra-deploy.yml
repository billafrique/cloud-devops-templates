name: Reusable — Deploy Infra (Dev)

on:
  workflow_call:
    secrets:
      DROPLET_IP:
        required: true
      SSH_PRIVATE_KEY:
        required: true

jobs:
  deploy-infra:
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout cloud-devops-templates
        uses: actions/checkout@v4
        with:
          repository: billafrique/cloud-devops-templates
          ref: main

      - name: Copy infra configs to droplet
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: deploy
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "infra-config/"
          target: "/opt/infra"
          strip_components: 1

      - name: Deploy infra services
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: deploy
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/infra
            docker compose -f docker-compose.infra.yml pull
            docker compose -f docker-compose.infra.yml up -d --remove-orphans
            docker compose -f docker-compose.infra.yml ps
            echo "✅ Infra deployed"
