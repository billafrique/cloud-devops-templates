name: Reusable — Frontend Build & Deploy (Dev)

on:
  workflow_call:
    inputs:
      image_tag:
        required: true
        type: string
    secrets:
      DROPLET_IP:
        required: true
      SSH_PRIVATE_KEY:
        required: true
      DOCR_TOKEN:
        required: true
      DOCR_ENDPOINT:
        required: true

jobs:
  build-push:
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout calling repo (frontend-app)
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --frozen-lockfile

      - name: Run tests
        run: npm test -- --watchAll=false --passWithNoTests

      - name: Build React app
        run: npm run build

      - name: Log in to DOCR
        run: |
          echo "${{ secrets.DOCR_TOKEN }}" | \
          docker login registry.digitalocean.com \
            -u "${{ secrets.DOCR_TOKEN }}" \
            --password-stdin

      - name: Build & push Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCR_ENDPOINT }}/frontend-app:${{ inputs.image_tag }} \
            -t ${{ secrets.DOCR_ENDPOINT }}/frontend-app:latest \
            .
          docker push ${{ secrets.DOCR_ENDPOINT }}/frontend-app:${{ inputs.image_tag }}
          docker push ${{ secrets.DOCR_ENDPOINT }}/frontend-app:latest

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout cloud-devops-templates
        uses: actions/checkout@v4
        with:
          repository: billafrique/cloud-devops-templates
          ref: main

      - name: Copy frontend compose config to droplet
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: deploy
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose-configs/frontend/docker-compose.prod.yml"
          target: "/opt/frontend"
          strip_components: 2

      - name: Deploy frontend
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: deploy
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "${{ secrets.DOCR_TOKEN }}" | \
            docker login registry.digitalocean.com \
              -u "${{ secrets.DOCR_TOKEN }}" \
              --password-stdin

            cd /opt/frontend
            export IMAGE_TAG=${{ inputs.image_tag }}
            export DOCR_ENDPOINT=${{ secrets.DOCR_ENDPOINT }}

            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d \
              --no-deps \
              --remove-orphans

            docker image prune -af --filter "until=24h"
            echo "✅ Frontend deployed: ${{ inputs.image_tag }}"
