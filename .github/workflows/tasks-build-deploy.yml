name: Reusable — Billafrique-Tasks Build, Scan & Deploy (Dev)

on:
  workflow_call:
    inputs:
      image_tag:
        required: true
        type: string
    secrets:
      DROPLET_IP:
        required: true
      SSH_PRIVATE_KEY:
        required: true
      DOCR_TOKEN:
        required: true
      DOCR_ENDPOINT:
        required: true
      G_TOKEN:
        required: true

jobs:
  build-push:
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout calling repo (Billafrique-Task-Tracker)
        uses: actions/checkout@v4

      - name: Log in to DOCR
        run: |
          echo "${{ secrets.DOCR_TOKEN }}" | \
          docker login registry.digitalocean.com \
            -u "${{ secrets.DOCR_TOKEN }}" \
            --password-stdin

      # Dockerfile does npm ci + prisma generate + next build, so no separate Node steps
      # SHA-only tag — every image is traceable to a commit
      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCR_ENDPOINT }}/billafrique-tasks:${{ inputs.image_tag }} \
            .

      # Scan BEFORE push so vulnerable images never reach DOCR
      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ secrets.DOCR_ENDPOINT }}/billafrique-tasks:${{ inputs.image_tag }}
          format: table
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Push Docker image to DOCR
        run: |
          docker push ${{ secrets.DOCR_ENDPOINT }}/billafrique-tasks:${{ inputs.image_tag }}

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout cloud-devops-templates
        uses: actions/checkout@v4
        with:
          repository: billafrique/cloud-devops-templates
          ref: main
          token: ${{ secrets.G_TOKEN }}

      - name: Copy billafrique-tasks compose config to droplet
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: deploy
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose-configs/billafrique-tasks/docker-compose.prod.yml"
          target: "/opt/billafrique-tasks"
          strip_components: 2

      - name: Deploy billafrique-tasks
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: deploy
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            echo "${{ secrets.DOCR_TOKEN }}" | \
            docker login registry.digitalocean.com \
              -u "${{ secrets.DOCR_TOKEN }}" \
              --password-stdin

            cd /opt/billafrique-tasks

            # Pin the exact SHA in .env (adds the line if missing)
            if grep -q '^IMAGE_TAG=' .env; then
              sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=${{ inputs.image_tag }}|" .env
            else
              echo "IMAGE_TAG=${{ inputs.image_tag }}" >> .env
            fi

            docker compose -f docker-compose.prod.yml pull

            # Start the app's own MySQL + Redis first and wait until healthy
            docker compose -f docker-compose.prod.yml up -d --wait tasks-mysql tasks-redis

            # Sync Prisma schema to MySQL (repo has no migrations folder yet).
            # db push refuses data-loss changes unless --accept-data-loss is passed.
            docker compose -f docker-compose.prod.yml run --rm --no-deps \
              billafrique-tasks node_modules/.bin/prisma db push --skip-generate

            # Roll the app container only (db/redis keep running)
            docker compose -f docker-compose.prod.yml up -d --no-deps --remove-orphans billafrique-tasks

            # Keep 48h of images for quick rollback
            docker image prune -af --filter "until=48h"

            echo "✅ billafrique-tasks deployed: ${{ inputs.image_tag }}"
