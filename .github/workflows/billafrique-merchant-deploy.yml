name: Reusable — Billafrique-merchant-Portal Build, Scan & Deploy (Dev)

on:
  workflow_call:
    inputs:
      image_tag:
        required: true
        type: string
    secrets:
      DROPLET_IP:
        required: true
      SSH_PRIVATE_KEY:
        required: true
      DOCR_TOKEN:
        required: true
      DOCR_ENDPOINT:
        required: true
      G_TOKEN:
        required: true 

jobs:
  build-push:
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout calling repo (billafrique-web)
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      

      - name: Log in to DOCR
        run: |
          echo "${{ secrets.DOCR_TOKEN }}" | \
          docker login registry.digitalocean.com \
            -u "${{ secrets.DOCR_TOKEN }}" \
            --password-stdin

      # ── Build image locally first — not pushed yet ──────────────────────────
      # SHA-only tag — no latest, every image is fully traceable to a commit
      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCR_ENDPOINT }}/billafrique-merchant-portal:${{ inputs.image_tag }} \
            .

      # ── Trivy scan — runs BEFORE push so vulnerable images never reach DOCR ──
      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCR_ENDPOINT }}/billafrique-merchant-portal:${{ inputs.image_tag }}
          format: table                   # human-readable output in Actions log
          exit-code: '0'                  # FAILS the pipeline if vulnerabilities found
          ignore-unfixed: true            # skip vulns that have no fix available yet
          vuln-type: 'os,library'         # scan OS packages and app dependencies
          severity: 'CRITICAL,HIGH'       # only block on CRITICAL and HIGH

      # ── Push only if Trivy scan passes ─────────────────────────────────────
      - name: Push Docker image to DOCR
        run: |
          docker push ${{ secrets.DOCR_ENDPOINT }}/billafrique-merchant-portal:${{ inputs.image_tag }}

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout cloud-devops-templates
        uses: actions/checkout@v4
        with:
          repository: billafrique/cloud-devops-templates
          ref: main
          token: ${{ secrets.G_TOKEN }}

      - name: Prepare target directory on droplet
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: deploy
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            if [ ! -d /opt/billafrique-merchant-portal ]; then
              sudo -n mkdir -p /opt/billafrique-merchant-portal
              sudo -n chown -R deploy:deploy /opt/billafrique-merchant-portal
            fi

      - name: Copy billafrique-merchant-portal compose config to droplet
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: deploy
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose-configs/billafrique-merchant-portal/docker-compose.dev.yml"
          target: "/opt/billafrique-merchant-portal"
          strip_components: 2

      - name: Deploy billafrique-merchant-portal
        uses: appleboy/ssh-action@v1.0.3
        env:
          TAG: ${{ inputs.image_tag || github.sha }}
          DOCR_TOKEN: ${{ secrets.DOCR_TOKEN }}
          REGISTRY: registry.digitalocean.com/billafrique
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: deploy
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: TAG,DOCR_TOKEN,REGISTRY
          script_stop: true
          script: |
            echo "$DOCR_TOKEN" | docker login registry.digitalocean.com \
              -u "$DOCR_TOKEN" --password-stdin

            cd /opt/billafrique-merchant-portal

            # Create .env if missing, then set or update each value
            touch .env
            set_env() {
              if grep -q "^$1=" .env; then
                sed -i "s|^$1=.*|$1=$2|" .env
              else
                echo "$1=$2" >> .env
              fi
            }
            set_env DOCR_ENDPOINT "$REGISTRY"
            set_env IMAGE_TAG "$TAG"

            # Make sure a shell variable can't override .env
            unset IMAGE_TAG DOCR_ENDPOINT

            echo "Deploying tag: $TAG"
            cat .env
            docker compose -f docker-compose.dev.yml config | grep image:

            docker compose -f docker-compose.dev.yml pull
            docker compose -f docker-compose.dev.yml up -d --remove-orphans

            # Keep last 48h of images for quick rollback, then prune older ones
            docker image prune -af --filter "until=48h"

            echo "✅ billafrique-merchant-portal deployed: $TAG"
