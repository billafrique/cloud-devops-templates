name: Reusable — Backend Build, Scan & Deploy (Dev)

on:
  workflow_call:
    inputs:
      image_tag:
        required: true
        type: string
    secrets:
      DROPLET_IP:
        required: true
      SSH_PRIVATE_KEY:
        required: true
      DOCR_TOKEN:
        required: true
      DOCR_ENDPOINT:
        required: true

jobs:
  build-push:
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout calling repo (billafrique-api)
        uses: actions/checkout@v4

      # No separate Maven build step needed — the Dockerfile handles
      # everything via multi-stage build:
      #   Stage 1: deps cache (pom.xml only)
      #   Stage 2: mvn clean package (source code)
      #   Stage 3: extract layered JAR
      #   Stage 4: lean Alpine runtime image

      - name: Log in to DOCR
        run: |
          echo "${{ secrets.DOCR_TOKEN }}" | \
          docker login registry.digitalocean.com \
            -u "${{ secrets.DOCR_TOKEN }}" \
            --password-stdin

      # SHA-only tag — no latest, every image is fully traceable to a commit
      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCR_ENDPOINT }}/billafrique-api:${{ inputs.image_tag }} \
            .

      # ── Trivy scan — runs BEFORE push so vulnerable images never reach DOCR ──
      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCR_ENDPOINT }}/billafrique-api:${{ inputs.image_tag }}
          format: table
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      # Push only if Trivy scan passes
      - name: Push Docker image to DOCR
        run: |
          docker push ${{ secrets.DOCR_ENDPOINT }}/billafrique-api:${{ inputs.image_tag }}

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout cloud-devops-templates
        uses: actions/checkout@v4
        with:
          repository: billafrique/cloud-devops-templates
          ref: main

      - name: Copy backend compose config to droplet
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: deploy
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose-configs/backend/docker-compose.prod.yml"
          target: "/opt/backend"
          strip_components: 2

      - name: Verify MySQL and Redis are healthy before deploying
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: deploy
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "Checking MySQL health..."
            for i in {1..10}; do
              MYSQL_ID=$(docker ps -qf "name=mysql")
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' "$MYSQL_ID" 2>/dev/null || echo "not_found")
              if [ "$STATUS" = "healthy" ]; then
                echo "✅ MySQL is healthy"
                break
              fi
              echo "⏳ Waiting for MySQL... ($i/10) — status: $STATUS"
              sleep 6
            done
            [ "$STATUS" = "healthy" ] || { echo "❌ MySQL not healthy — aborting"; exit 1; }

            echo "Checking Redis health..."
            for i in {1..10}; do
              REDIS_ID=$(docker ps -qf "name=redis")
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' "$REDIS_ID" 2>/dev/null || echo "not_found")
              if [ "$STATUS" = "healthy" ]; then
                echo "✅ Redis is healthy"
                break
              fi
              echo "⏳ Waiting for Redis... ($i/10) — status: $STATUS"
              sleep 6
            done
            [ "$STATUS" = "healthy" ] || { echo "❌ Redis not healthy — aborting"; exit 1; }

      - name: Deploy billafrique-api
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: deploy
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "${{ secrets.DOCR_TOKEN }}" | \
            docker login registry.digitalocean.com \
              -u "${{ secrets.DOCR_TOKEN }}" \
              --password-stdin

            cd /opt/backend

            # Inject the exact SHA into .env so docker compose pulls the right image
            sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=${{ inputs.image_tag }}|" .env

            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d \
              --no-deps \
              --remove-orphans

            # Keep last 48h of images for quick rollback — prune older ones
            docker image prune -af --filter "until=48h"

            echo "✅ billafrique-api deployed: ${{ inputs.image_tag }}"

